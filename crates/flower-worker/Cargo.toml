[package]
name = "flower-worker"
description = "Flower queue workers and reconcilers: the Rust twin of @flower-js/sdk/worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

# serde_json features: NEVER enable `preserve_order` or `arbitrary_precision` here. Cargo unifies
# features across a Flower `--workspace` build, and the server's canonical JSON relies on sorted
# `Map`s and plain `Number`s. `raw_value` lets request arguments keep the key order the TS SDK sends.
[features]
default = ["flower-client"]
# QueueClient for flower_client::FlowerClient (and ClientError for FlowerError).
flower-client = ["dep:flower-client"]
# An in-memory Flower (queue.http() and external().http() methods) and a client over it, for tests.
testing = ["dep:sha2"]

[dependencies]
fastrand = "2"
flower-client = { path = "../flower-client", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
getrandom = "0.4"
parking_lot = "0.12"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = "0.7"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
fastrand = "2"
flower-worker = { path = ".", features = ["testing"] }
tempfile = "3"
sha2 = "0.11"
tokio = { version = "1", features = ["full", "test-util"] }
parking_lot = "0.12"
tokio-util = "0.7"
