[package]
name = "flower-client"
description = "A client for Flower: queries, mutations, watches, queue workers and the admin API"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

# serde_json features: NEVER enable `preserve_order` or `arbitrary_precision` here. Cargo unifies
# features across a Flower `--workspace` build, and the server's canonical JSON relies on sorted
# `Map`s and plain `Number`s (see tests/guard.rs). `unbounded_depth` is already on in the server.
[dependencies]
bytes = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
h2 = "0.4"
http = "1"
hyper = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
rustls-pki-types = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws-lc-rs", "tls12"] }
